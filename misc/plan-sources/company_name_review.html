
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }
.wrap { padding: 1rem 0; }
.section { margin-bottom: 2rem; }
.section-title { font-size: 15px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 0.75rem; padding-bottom: 0.5rem; border-bottom: 0.5px solid var(--color-border-tertiary); }
.section-desc { font-size: 13px; color: var(--color-text-secondary); margin-bottom: 0.75rem; line-height: 1.5; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 8px 10px; font-weight: 500; font-size: 12px; color: var(--color-text-secondary); background: var(--color-background-secondary); border-bottom: 0.5px solid var(--color-border-tertiary); }
td { padding: 7px 10px; border-bottom: 0.5px solid var(--color-border-tertiary); vertical-align: top; line-height: 1.5; }
tr:last-child td { border-bottom: none; }
.badge { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 99px; font-weight: 500; }
.b-ok { background: var(--color-background-success); color: var(--color-text-success); }
.b-fix { background: var(--color-background-warning); color: var(--color-text-warning); }
.b-new { background: var(--color-background-info); color: var(--color-text-info); }
.b-q { background: var(--color-background-secondary); color: var(--color-text-secondary); }
.orig { color: var(--color-text-secondary); font-size: 12px; }
.arrow { color: var(--color-text-tertiary); margin: 0 4px; }
.suggested { font-weight: 500; color: var(--color-text-primary); }
.note { font-size: 12px; color: var(--color-text-secondary); margin-top: 2px; }
.filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; }
button.filter-btn { font-size: 12px; padding: 4px 12px; border-radius: 99px; border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-secondary); cursor: pointer; }
button.filter-btn.active { background: var(--color-background-info); color: var(--color-text-info); border-color: var(--color-border-info); }
.count-badge { font-size: 11px; background: var(--color-background-secondary); color: var(--color-text-tertiary); padding: 1px 6px; border-radius: 99px; margin-left: 4px; }
</style>

<div class="wrap">
<h2 class="sr-only">Company name mapping review — corrections and suggestions</h2>

<div class="filter-row">
  <button class="filter-btn active" onclick="filter('all', this)">All <span class="count-badge" id="cnt-all">0</span></button>
  <button class="filter-btn" onclick="filter('fix', this)">Corrections <span class="count-badge" id="cnt-fix">0</span></button>
  <button class="filter-btn" onclick="filter('new', this)">New suggestions <span class="count-badge" id="cnt-new">0</span></button>
  <button class="filter-btn" onclick="filter('ok', this)">Confirmed ok <span class="count-badge" id="cnt-ok">0</span></button>
  <button class="filter-btn" onclick="filter('q', this)">Questions <span class="count-badge" id="cnt-q">0</span></button>
</div>

<table id="main-table">
<thead><tr>
  <th style="width:36%">Normalized name (from CSV)</th>
  <th style="width:22%">Your mapping</th>
  <th style="width:22%">Verdict / suggestion</th>
  <th style="width:20%">Notes</th>
</tr></thead>
<tbody id="tbody"></tbody>
</table>
</div>

  { type:"fix", orig:"ClalInsuranceFinance", yours:"(missing)", suggest:"Clal", note:"See above" },

  { type:"new", orig:"AmazonWebServicesAws", yours:"AmazonWeb → Amazon", suggest:"Amazon (or AWS)", note:"Full form in CSV is 'Amazon Web Services AWS'" },
  { type:"new", orig:"IclGroup", yours:"(missing)", suggest:"ICL", note:"Israel Chemicals — in CSV" },
  { type:"new", orig:"BdoIsrael", yours:"(missing)", suggest:"BDO", note:"Accounting firm — in CSV" },
  { type:"new", orig:"MenoraMivtachimGroup", yours:"(missing)", suggest:"Menora", note:"Major Israeli insurer — in CSV" },
  { type:"new", orig:"HewlettPackardEnterprise", yours:"(missing)", suggest:"HPE", note:"In CSV; note: distinct from HP consumer" },

  { type:"q", orig:"MorningByGreen", yours:"Morning", suggest:"Morning?", note:"Confirm this is 'Morning' the Israeli grocery delivery app — or a different company" },
  { type:"q", orig:"TheCenter → CET", yours:"CET", suggest:"CET", note:"Is this the Center for Educational Technology (מרכז לטכנולוגיה חינוכית)? If so CET is correct" },

  { type:"ok", orig:"DellTechnologies → Dell", yours:"Dell", suggest:"✓", note:"Good" },

  { type:"ok", orig:"EBay → eBay", yours:"eBay", suggest:"✓", note:"Correct casing" },
  { type:"ok", orig:"BUYMETechnologies → BUYME", yours:"BUYME", suggest:"✓", note:"Good" },
  { type:"ok", orig:"PhoenixFinancial / PhoenixHoldings → Phoenix", yours:"Phoenix", suggest:"✓", note:"Good" },
  { type:"ok", orig:"MigdalGroup → Migdal", yours:"Migdal", suggest:"✓", note:"Good — see MigdalCapitalMarkets correction" },
];

const tbody = document.getElementById('tbody');
const counts = { all:0, fix:0, new:0, ok:0, q:0 };

function renderRow(r) {
  const tr = document.createElement('tr');
  tr.dataset.type = r.type;
  const badgeMap = { fix: ['b-fix','correction'], new: ['b-new','new suggestion'], ok: ['b-ok','confirmed'], q: ['b-q','question'] };
  const [cls, label] = badgeMap[r.type];
  tr.innerHTML = `
    <td><span class="orig">${r.orig}</span></td>
    <td>${r.yours}</td>
    <td><span class="badge ${cls}">${label}</span> <span class="suggested">${r.suggest}</span></td>
    <td><span class="note">${r.note}</span></td>
  `;
  return tr;
}

rows.forEach(r => {
  counts.all++;
  counts[r.type]++;
  tbody.appendChild(renderRow(r));
});

document.getElementById('cnt-all').textContent = counts.all;
document.getElementById('cnt-fix').textContent = counts.fix;
document.getElementById('cnt-new').textContent = counts.new;
document.getElementById('cnt-ok').textContent = counts.ok;
document.getElementById('cnt-q').textContent = counts.q;

function filter(type, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('#tbody tr').forEach(tr => {
    tr.style.display = (type === 'all' || tr.dataset.type === type) ? '' : 'none';
  });
}
</script>
